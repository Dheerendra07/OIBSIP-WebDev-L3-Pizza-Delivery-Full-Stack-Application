name: Pizza House CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'build/**', 'docs/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pizza-house-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Check hosted browser smoke script syntax
        run: node --check scripts/deployed-browser-smoke.mjs
      - name: Install locked root, API, and web dependencies
        run: npm run install:all
      - name: Audit root, API, and web dependencies for high/critical vulnerabilities
        run: |
          npm audit --audit-level=high
          npm --prefix server audit --audit-level=high
          npm --prefix client audit --audit-level=high
      - name: Build production web bundle
        run: npm run build
      - name: Run API and client unit tests
        run: npm test
