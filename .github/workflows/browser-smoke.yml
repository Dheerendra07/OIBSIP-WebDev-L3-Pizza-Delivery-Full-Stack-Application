name: Pizza House Browser Smoke

on:
  # Run only against the published production app, never a PR commit before
  # Render Static Site has deployed it. The script polls for the new UI marker.
  push:
    branches: [main]
    paths:
      - 'scripts/deployed-browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
      - 'client/src/**'
      - 'client/index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pizza-house-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Playwright browser driver
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise the hosted website in a real browser
        env:
          CLIENT_WEB_URL: https://pizza-house-api.onrender.com
        run: node scripts/deployed-browser-smoke.mjs
