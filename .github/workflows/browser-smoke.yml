name: Pizza House Browser Smoke

on:
  # Run only against the published production app, never a PR commit before
  # Render Static Site has deployed it. The script polls for the new UI marker.
  push:
    branches: [main]
    paths:
      - 'scripts/deployed-browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
      - 'client/src/**'
      - 'client/index.html'
      # Backend CSP changes can break frontend assets even when the client bundle is unchanged.
      - 'server/src/app.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pizza-house-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned Playwright browser driver
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Restore cached Chromium browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.56.1-chromium-v1
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # Always smoke-test successful customer UI/session transitions with mocked endpoints.
      # Optional repository secrets additionally enable the live production-cookie/session check.
      - name: Exercise the hosted website in a real browser
        env:
          CLIENT_WEB_URL: https://pizza-house-api.onrender.com
          # Never expose production QA secrets to workflow_dispatch runs on non-main refs.
          PIZZA_QA_CUSTOMER_EMAIL: ${{ github.ref == 'refs/heads/main' && secrets.PIZZA_QA_CUSTOMER_EMAIL || '' }}
          PIZZA_QA_CUSTOMER_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.PIZZA_QA_CUSTOMER_PASSWORD || '' }}
        run: node scripts/deployed-browser-smoke.mjs

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pizza-house-browser-qa-${{ github.run_id }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
