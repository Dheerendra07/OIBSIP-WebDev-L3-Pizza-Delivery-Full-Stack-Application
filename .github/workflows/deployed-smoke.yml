name: Deployed smoke checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deployed-smoke.yml'
      - 'server/src/**'
      - 'server/tests/**'
      - 'client/src/**'
      - 'client/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pizza-house-deployed-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployed API, catalog, CORS, webhook guard and website
        env:
          API_BASE_URL: https://pizza-house-api.onrender.com
          CLIENT_WEB_URL: https://pizza-house-web-n75h.onrender.com
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const apiRaw = process.env.API_BASE_URL;
          const apiBase = apiRaw.endsWith('/') ? apiRaw.slice(0, -1) : apiRaw;
          const webRaw = process.env.CLIENT_WEB_URL;
          const webBase = webRaw.endsWith('/') ? webRaw.slice(0, -1) : webRaw;

          async function getJson(path) {
            const response = await fetch(`${apiBase}${path}`, {
              signal: AbortSignal.timeout(8000),
              headers: { Accept: 'application/json' },
            });
            const body = await response.json().catch(() => null);
            return { response, body };
          }

          async function checkAll() {
            const results = [];

            const root = await getJson('/');
            assert.equal(root.response.status, 200, 'API root must return HTTP 200, not Route not found');
            assert.equal(root.body?.service, 'pizza-house-api');
            assert.equal(root.body?.status, 'ok');
            assert.equal(root.body?.website, webBase);
            results.push('API root');

            const base = await getJson('/api');
            assert.equal(base.response.status, 200, 'API base path must return HTTP 200');
            assert.equal(base.body?.service, 'pizza-house-api');
            results.push('API base');

            const health = await getJson('/api/health');
            assert.equal(health.response.status, 200);
            assert.equal(health.body?.status, 'ok');
            results.push('health');

            const catalog = await getJson('/api/catalog');
            assert.equal(catalog.response.status, 200, 'catalog must be available from the database');
            for (const group of ['bases', 'sauces', 'cheeses', 'vegetables']) {
              assert.ok(Array.isArray(catalog.body?.catalog?.[group]), `catalog.${group} must be an array`);
              assert.ok(catalog.body.catalog[group].length > 0, `catalog.${group} must not be empty`);
            }
            assert.ok(Array.isArray(catalog.body?.featuredPizzas));
            assert.ok(catalog.body.featuredPizzas.length > 0);
            results.push('catalog/database');

            const preflight = await fetch(`${apiBase}/api/health`, {
              method: 'OPTIONS',
              signal: AbortSignal.timeout(8000),
              headers: {
                Origin: webBase,
                'Access-Control-Request-Method': 'GET',
              },
            });
            assert.ok(preflight.status === 200 || preflight.status === 204, 'CORS preflight should pass');
            assert.equal(preflight.headers.get('access-control-allow-origin'), webBase);
            assert.equal(preflight.headers.get('access-control-allow-credentials'), 'true');
            results.push('credentialed CORS');

            // The customer API must reject a request without a session cookie.
            const me = await fetch(`${apiBase}/api/auth/me`, {
              signal: AbortSignal.timeout(8000),
              headers: { Origin: webBase },
            });
            assert.equal(me.status, 401, 'unauthenticated /auth/me must not disclose a user session');
            assert.equal(me.headers.get('access-control-allow-origin'), webBase);
            assert.equal(me.headers.get('access-control-allow-credentials'), 'true');
            results.push('unauthenticated session guard');

            // Safe live auth probes: exercise the registered route and DB lookup without
            // creating a persistent production account or sending verification email.
            const registrationValidation = await fetch(`${apiBase}/api/auth/register`, {
              method: 'POST',
              signal: AbortSignal.timeout(8000),
              headers: {
                Origin: webBase,
                'Content-Type': 'application/json',
                Accept: 'application/json',
              },
              body: JSON.stringify({
                name: 'Smoke Test',
                email: 'not-an-email',
                password: 'SmokeTestPassword123',
              }),
            });
            assert.equal(registrationValidation.status, 400, 'registration must validate bad email before writing to the database');
            const registrationValidationBody = await registrationValidation.json();
            assert.match(registrationValidationBody?.error || '', /valid email/i);
            assert.equal(registrationValidation.headers.get('access-control-allow-origin'), webBase);
            assert.equal(registrationValidation.headers.get('access-control-allow-credentials'), 'true');
            results.push('auth registration validation');

            const loginProbeEmail = `deployed-smoke-${process.env.GITHUB_RUN_ID || Date.now()}-${process.env.GITHUB_RUN_ATTEMPT || 1}@example.invalid`;
            const loginProbe = await fetch(`${apiBase}/api/auth/login`, {
              method: 'POST',
              signal: AbortSignal.timeout(8000),
              headers: {
                Origin: webBase,
                'Content-Type': 'application/json',
                Accept: 'application/json',
              },
              body: JSON.stringify({ email: loginProbeEmail, password: 'NeverThePassword123' }),
            });
            assert.equal(loginProbe.status, 401, 'login lookup for an unknown account should return 401; a server error can indicate DB/auth failure');
            assert.equal(loginProbe.headers.get('access-control-allow-origin'), webBase);
            assert.equal(loginProbe.headers.get('access-control-allow-credentials'), 'true');
            results.push('auth login lookup/database path');

            // Browser GET must explain that provider webhook deliveries are POST-only.
            const webhookGet = await fetch(`${apiBase}/api/payments/webhook`, {
              signal: AbortSignal.timeout(8000),
            });
            assert.equal(webhookGet.status, 405, 'webhook GET should explain POST-only behavior');
            const webhookGetBody = await webhookGet.json();
            assert.match(webhookGetBody?.error || '', /POST requests only/i);
            results.push('webhook GET guidance');

            // Intentionally invalid test signature: this must not create a receipt or alter an order.
            const webhook = await fetch(`${apiBase}/api/payments/webhook`, {
              method: 'POST',
              signal: AbortSignal.timeout(8000),
              headers: {
                'Content-Type': 'application/json',
                'X-Razorpay-Signature': 'invalid-smoke-test-signature',
                'X-Razorpay-Event-Id': 'deployed-smoke-invalid-signature',
              },
              body: JSON.stringify({ event: 'payment.captured', payload: { payment: { entity: {} } } }),
            });
            assert.equal(webhook.status, 401, 'webhook must reject invalid signatures');
            results.push('webhook signature guard');

            const website = await fetch(webBase, {
              signal: AbortSignal.timeout(8000),
              headers: { Accept: 'text/html' },
            });
            assert.equal(website.status, 200, 'customer website must return HTTP 200');
            const html = await website.text();
            assert.ok(html.includes('id="root"'), 'website HTML must contain the app root');
            assert.ok(html.includes('<title'), 'website HTML must contain a title');

            // Verify the generated production JavaScript uses the hosted API, not localhost.
            const scriptMatch = html.match(/<script\b[^>]*\bsrc=["']([^"']+\.js[^"']*)["']/i);
            assert.ok(scriptMatch, 'website HTML must reference a JavaScript bundle');
            const bundleUrl = new URL(scriptMatch[1], webBase);
            const bundleResponse = await fetch(bundleUrl, { signal: AbortSignal.timeout(8000) });
            assert.equal(bundleResponse.status, 200, 'production JavaScript bundle must be reachable');
            const bundle = await bundleResponse.text();
            assert.ok(bundle.includes(`${apiBase}/api`), 'production bundle must point at the deployed API URL');
            assert.ok(!bundle.includes('http://localhost:4000/api'), 'production bundle must not fall back to localhost API');
            assert.ok(bundle.includes('pizza-house.checkout-draft'), 'deployed bundle must include checkout draft recovery code');
            assert.ok(bundle.includes("We couldn't confirm sign-out. Check your connection and try again."), 'deployed bundle must include the logout failure recovery fix');
            results.push('production bundle API URL');
            results.push('checkout draft recovery bundle');
            results.push('logout failure recovery bundle');
            results.push('customer website');

            return results;
          }

          let lastError;
          for (let attempt = 1; attempt <= 20; attempt += 1) {
            try {
              const passed = await checkAll();
              for (const name of passed) console.log(`[PASS] ${name}`);
              console.log(`Deployed smoke checks passed: ${passed.length}/${passed.length}`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.error(`Attempt ${attempt}/20 failed: ${error.message}`);
              if (attempt < 20) await new Promise((resolve) => setTimeout(resolve, 15000));
            }
          }
          console.error('Deployed smoke checks failed after retries:', lastError?.stack || lastError);
          process.exit(1);
          NODE
