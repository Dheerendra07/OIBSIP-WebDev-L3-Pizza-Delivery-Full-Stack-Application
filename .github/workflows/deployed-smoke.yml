name: Deployed smoke checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deployed-smoke.yml'
      - 'server/src/**'
      - 'server/tests/**'
      - 'client/src/**'
      - 'client/index.html'
      - 'client/public/**'
      - 'scripts/deployed-browser-smoke.mjs'
      - 'client/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pizza-house-deployed-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history lets the smoke check verify deployed-commit ancestry and runtime diffs.
          fetch-depth: 0

      # A rerun may execute after Render deployed a later documentation-only commit.
      # Fetch current main so that commit is available for ancestry/runtime-diff checks.
      - name: Fetch current main history for release verification
        run: git fetch --no-tags origin main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The deployment can be older or newer than this smoke run if a release and
      # test/docs-only commit race each other. Require the two SHAs to be on the same
      # ancestry line, then compare runtime files in both snapshots.
      - name: Verify deployed API, catalog, CORS, webhook guard and website
        env:
          API_BASE_URL: https://pizza-house-api.onrender.com
          CLIENT_WEB_URL: https://pizza-house-api.onrender.com
          TESTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync, spawnSync } from 'node:child_process';

          const apiRaw = process.env.API_BASE_URL;
          const apiBase = apiRaw.endsWith('/') ? apiRaw.slice(0, -1) : apiRaw;
          const webBase = (process.env.CLIENT_WEB_URL || apiBase).replace(/\/$/, '');

          async function getJson(path) {
            const response = await fetch(`${apiBase}${path}`, {
              signal: AbortSignal.timeout(8000),
              headers: { Accept: 'application/json' },
            });
            const body = await response.json().catch(() => null);
            return { response, body };
          }

          async function checkAll() {
            const results = [];

            const rootResponse = await fetch(`${apiBase}/`, {
              signal: AbortSignal.timeout(8000),
              headers: { Accept: 'text/html,application/json' },
            });
            assert.equal(rootResponse.status, 200, 'service root must return HTTP 200');
            const rootContentType = rootResponse.headers.get('content-type') || '';
            if (rootContentType.includes('text/html')) {
              const rootHtml = await rootResponse.text();
              assert.ok(rootHtml.includes('id="root"'), 'same-origin customer website must contain the app root');
              assert.ok(rootHtml.includes('<title'), 'same-origin customer website must contain a title');
              results.push('same-origin customer website root');
            } else {
              const root = await rootResponse.json();
              assert.equal(root.service, 'pizza-house-api');
              assert.equal(root.status, 'ok');
              assert.equal(root.website, webBase);
              results.push('API root');
            }

            const base = await getJson('/api');
            assert.equal(base.response.status, 200, 'API base path must return HTTP 200');
            assert.equal(base.body?.service, 'pizza-house-api');
            results.push('API base');

            const health = await getJson('/api/health');
            assert.equal(health.response.status, 200, 'health must only pass while MongoDB is connected');
            assert.equal(health.body?.status, 'ok');
            assert.equal(health.body?.dependencies?.database, 'connected', 'database readiness must be explicit');
            const deployedCommit = health.body?.version;
            const testedCommit = process.env.TESTED_COMMIT_SHA;
            assert.match(deployedCommit || '', /^[a-f0-9]{40}$/i, 'API health must expose the deployed Git commit SHA');
            const deployedBeforeTest = spawnSync('git', ['merge-base', '--is-ancestor', deployedCommit, testedCommit], { stdio: 'ignore' });
            const deployedAfterTest = spawnSync('git', ['merge-base', '--is-ancestor', testedCommit, deployedCommit], { stdio: 'ignore' });
            assert.ok(
              deployedBeforeTest.status === 0 || deployedAfterTest.status === 0,
              `deployed commit ${deployedCommit} and tested commit ${testedCommit} must be on the same Git ancestry line`,
            );
            const runtimeChanges = execFileSync('git', [
              'diff', '--name-only', deployedCommit, testedCommit, '--',
              'server/src', 'server/scripts', 'server/package.json', 'server/package-lock.json',
              'client/src', 'client/public', 'client/index.html', 'client/vite.config.*',
              'client/package.json', 'client/package-lock.json',
              'package.json', 'package-lock.json', 'scripts/render-client-build.js',
            ], { encoding: 'utf8' }).trim();
            assert.equal(
              runtimeChanges,
              '',
              `deployed revision ${deployedCommit} is missing runtime changes from ${testedCommit}:\n${runtimeChanges}`,
            );
            results.push('health/database readiness/deployed revision has no missing runtime changes');

            const catalog = await getJson('/api/catalog');
            assert.equal(catalog.response.status, 200, 'catalog must be available from the database');
            for (const group of ['bases', 'sauces', 'cheeses', 'vegetables']) {
              assert.ok(Array.isArray(catalog.body?.catalog?.[group]), `catalog.${group} must be an array`);
              assert.ok(catalog.body.catalog[group].length > 0, `catalog.${group} must not be empty`);
            }
            assert.ok(Array.isArray(catalog.body?.featuredPizzas));
            assert.ok(catalog.body.featuredPizzas.length > 0);
            results.push('catalog/database');

            const preflight = await fetch(`${apiBase}/api/health`, {
              method: 'OPTIONS',
              signal: AbortSignal.timeout(8000),
              headers: {
                Origin: webBase,
                'Access-Control-Request-Method': 'GET',
              },
            });
            assert.ok(preflight.status === 200 || preflight.status === 204, 'CORS preflight should pass');
            assert.equal(preflight.headers.get('access-control-allow-origin'), webBase);
            assert.equal(preflight.headers.get('access-control-allow-credentials'), 'true');
            results.push('credentialed CORS');

            const checkoutPreflight = await fetch(`${apiBase}/api/orders`, {
              method: 'OPTIONS',
              signal: AbortSignal.timeout(8000),
              headers: {
                Origin: webBase,
                'Access-Control-Request-Method': 'POST',
                'Access-Control-Request-Headers': 'content-type,idempotency-key',
              },
            });
            assert.ok(checkoutPreflight.status === 200 || checkoutPreflight.status === 204, 'checkout preflight should pass');
            assert.equal(checkoutPreflight.headers.get('access-control-allow-origin'), webBase);
            const allowedHeaders = (checkoutPreflight.headers.get('access-control-allow-headers') || '')
              .split(',').map((value) => value.trim().toLowerCase());
            assert.ok(allowedHeaders.includes('idempotency-key'), 'browser checkout retries need the idempotency header allowed by CORS');
            results.push('checkout idempotency CORS preflight');

            // The customer API must reject a request without a session cookie.
            const me = await fetch(`${apiBase}/api/auth/me`, {
              signal: AbortSignal.timeout(8000),
              headers: { Origin: webBase },
            });
            assert.equal(me.status, 401, 'unauthenticated /auth/me must not disclose a user session');
            assert.equal(me.headers.get('access-control-allow-origin'), webBase);
            assert.equal(me.headers.get('access-control-allow-credentials'), 'true');
            results.push('unauthenticated session guard');

            // Payment-provider diagnostics must remain admin-only, and unauthenticated
            // requests must never trigger a Razorpay network check.
            const providerCheck = await fetch(`${apiBase}/api/admin/payment-provider-check`, {
              signal: AbortSignal.timeout(8000),
              headers: { Origin: webBase, Accept: 'application/json' },
            });
            assert.equal(providerCheck.status, 401, 'payment-provider diagnostics must require an authenticated admin session');
            const providerCheckBody = await providerCheck.json();
            assert.equal(providerCheckBody?.error, 'Sign in to continue');
            assert.equal(providerCheck.headers.get('access-control-allow-origin'), webBase);
            assert.equal(providerCheck.headers.get('access-control-allow-credentials'), 'true');
            results.push('payment-provider diagnostic admin/session guard');

            // Safe live auth probes: exercise the registered route and DB lookup without
            // creating a persistent production account or sending verification email.
            const registrationValidation = await fetch(`${apiBase}/api/auth/register`, {
              method: 'POST',
              signal: AbortSignal.timeout(8000),
              headers: {
                Origin: webBase,
                'Content-Type': 'application/json',
                Accept: 'application/json',
              },
              body: JSON.stringify({
                name: 'Smoke Test',
                email: 'not-an-email',
                password: 'SmokeTestPassword123',
              }),
            });
            const registrationValidationBody = await registrationValidation.json().catch(() => null);
            if (registrationValidation.status === 400) {
              assert.match(registrationValidationBody?.error || '', /valid email/i);
              results.push('auth registration validation');
            } else if (registrationValidation.status === 429) {
              assert.match(registrationValidationBody?.error || '', /too many attempts/i);
              results.push('auth registration rate-limit guard');
            } else {
              assert.fail('registration probe expected HTTP 400 or protected rate limit 429; received ' + registrationValidation.status);
            }
            assert.equal(registrationValidation.headers.get('access-control-allow-origin'), webBase);
            assert.equal(registrationValidation.headers.get('access-control-allow-credentials'), 'true');

            const loginProbeEmail = `deployed-smoke-${process.env.GITHUB_RUN_ID || Date.now()}-${process.env.GITHUB_RUN_ATTEMPT || 1}@example.invalid`;
            const loginProbe = await fetch(`${apiBase}/api/auth/login`, {
              method: 'POST',
              signal: AbortSignal.timeout(8000),
              headers: {
                Origin: webBase,
                'Content-Type': 'application/json',
                Accept: 'application/json',
              },
              body: JSON.stringify({ email: loginProbeEmail, password: 'NeverThePassword123' }),
            });
            const loginProbeBody = await loginProbe.json().catch(() => null);
            if (loginProbe.status === 401) {
              results.push('auth login lookup/database path');
            } else if (loginProbe.status === 429) {
              assert.match(loginProbeBody?.error || '', /too many attempts/i);
              results.push('auth login rate-limit guard');
            } else {
              assert.fail('login lookup expected HTTP 401 or protected rate limit 429; received ' + loginProbe.status);
            }
            assert.equal(loginProbe.headers.get('access-control-allow-origin'), webBase);
            assert.equal(loginProbe.headers.get('access-control-allow-credentials'), 'true');

            // Browser GET must explain that provider webhook deliveries are POST-only.
            const webhookGet = await fetch(`${apiBase}/api/payments/webhook`, {
              signal: AbortSignal.timeout(8000),
            });
            assert.equal(webhookGet.status, 405, 'webhook GET should explain POST-only behavior');
            const webhookGetBody = await webhookGet.json();
            assert.match(webhookGetBody?.error || '', /POST requests only/i);
            results.push('webhook GET guidance');

            // Intentionally invalid test signature: this must not create a receipt or alter an order.
            const webhook = await fetch(`${apiBase}/api/payments/webhook`, {
              method: 'POST',
              signal: AbortSignal.timeout(8000),
              headers: {
                'Content-Type': 'application/json',
                'X-Razorpay-Signature': 'invalid-smoke-test-signature',
                'X-Razorpay-Event-Id': 'deployed-smoke-invalid-signature',
              },
              body: JSON.stringify({ event: 'payment.captured', payload: { payment: { entity: {} } } }),
            });
            assert.equal(webhook.status, 401, 'webhook must reject invalid signatures');
            results.push('webhook signature guard');

            const website = await fetch(webBase, {
              signal: AbortSignal.timeout(8000),
              headers: { Accept: 'text/html' },
            });
            assert.equal(website.status, 200, 'customer website must return HTTP 200');
            const html = await website.text();
            assert.ok(html.includes('id="root"'), 'website HTML must contain the app root');
            assert.ok(html.includes('<title'), 'website HTML must contain a title');

            // Verify the generated production JavaScript uses the hosted API, not localhost.
            const scriptMatch = html.match(/<script\b[^>]*\btype=["']module["'][^>]*\bsrc=["']([^"']+\.js[^"']*)["']/i);
            assert.ok(scriptMatch, 'website HTML must reference a JavaScript bundle');
            const bundleUrl = new URL(scriptMatch[1], webBase);
            const bundleResponse = await fetch(bundleUrl, { signal: AbortSignal.timeout(8000) });
            assert.equal(bundleResponse.status, 200, 'production JavaScript bundle must be reachable');
            const bundle = await bundleResponse.text();
            const normalizedBundle = bundle.replaceAll("\\/", "/");
            const usesDeployedApi = normalizedBundle.includes(`${apiBase}/api`) || normalizedBundle.includes(`${apiBase}/api/`);
            const usesSameOriginApi = /[\x60"']\/api\/?[\x60"']/.test(normalizedBundle) || /[\x60"']\/api\//.test(normalizedBundle);
            const apiPathSamples = [...normalizedBundle.matchAll(/.{0,20}\/api\/.{0,20}|.{0,20}\/api.{0,20}/g)].slice(0, 3).map((match) => match[0]);
            assert.ok(usesDeployedApi || usesSameOriginApi, `production bundle must use the deployed API URL or same-origin /api path (hostFound=${normalizedBundle.includes(new URL(apiBase).host)}, paths=${JSON.stringify(apiPathSamples)})`);
            assert.ok(!bundle.includes('http://localhost:4000/api'), 'production bundle must not fall back to localhost API');
            assert.ok(bundle.includes('pizza-house.checkout-draft'), 'deployed bundle must include checkout draft recovery code');
            assert.ok(bundle.includes("We couldn't confirm sign-out. Check your connection and try again."), 'deployed bundle must include the logout failure recovery fix');
            results.push('production bundle API URL');
            results.push('checkout draft recovery bundle');
            results.push('logout failure recovery bundle');
            results.push('customer website');

            return results;
          }

          let lastError;
          for (let attempt = 1; attempt <= 20; attempt += 1) {
            try {
              const passed = await checkAll();
              for (const name of passed) console.log(`[PASS] ${name}`);
              console.log(`Deployed smoke checks passed: ${passed.length}/${passed.length}`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.error(`Attempt ${attempt}/20 failed: ${error.message}`);
              if (attempt < 20) await new Promise((resolve) => setTimeout(resolve, 15000));
            }
          }
          console.error('Deployed smoke checks failed after retries:', lastError?.stack || lastError);
          process.exit(1);
          NODE
